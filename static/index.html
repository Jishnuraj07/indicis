<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  /* Slip-box identity: index cards laid out on graph paper, written in blue-black ink. */
  :root {
    --paper: #e7ece8; --grid: #d8e0db; --grid-major: #c6d2cb;
    --card: #fdfdfa; --ink: #1d2838; --muted: #5d6a72; --line: #cdd6d1;
    --rule: #c9dbea; --margin: #d2463c; --accent: #2643b0; --accent-ink: #ffffff;
    --edge: #8e9ca6; --ok: #2f7d4f; --danger: #b42318;
    --t-concept: #2643b0; --t-person: #c2410c; --t-book: #2f7d4f; --t-project: #8a3fa0; --t-note: #6b7480; --t-missing: #9aa5ad;
    --shadow: 0 1px 0 rgba(29, 40, 56, .06), 0 10px 24px -14px rgba(29, 40, 56, .35);
    --ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --serif: "Spectral", Georgia, serif;
    --lh: 28px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141a1e; --grid: #1b2328; --grid-major: #243039;
      --card: #1e272d; --ink: #e3e8ea; --muted: #92a0a8; --line: #2c3840;
      --rule: #2a3946; --margin: #e0675d; --accent: #8ea2ff; --accent-ink: #10151a;
      --edge: #4f606b; --ok: #6cc597; --danger: #ff8a7a;
      --t-concept: #8ea2ff; --t-person: #ff9a5c; --t-book: #6cc597; --t-project: #d38ae6; --t-note: #a3adb6; --t-missing: #5f6d76;
      --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 14px 30px -16px rgba(0, 0, 0, .8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #141a1e; --grid: #1b2328; --grid-major: #243039;
    --card: #1e272d; --ink: #e3e8ea; --muted: #92a0a8; --line: #2c3840;
    --rule: #2a3946; --margin: #e0675d; --accent: #8ea2ff; --accent-ink: #10151a;
    --edge: #4f606b; --ok: #6cc597; --danger: #ff8a7a;
    --t-concept: #8ea2ff; --t-person: #ff9a5c; --t-book: #6cc597; --t-project: #d38ae6; --t-note: #a3adb6; --t-missing: #5f6d76;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 14px 30px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font: 15px/1.45 var(--ui); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }

  .app { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 440px); grid-template-rows: auto minmax(0, 1fr); height: 100vh; }

  /* ---------- top bar ---------- */
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: 12px; }
  .brand svg { flex: none; }
  .brand b { font: 600 21px/1 var(--serif); letter-spacing: -.01em; }
  .field { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--line);
    border-radius: 6px; padding: 0 10px; height: 34px; }
  .field svg { color: var(--muted); flex: none; }
  .field input, .field select { border: 0; background: transparent; height: 100%; outline: none; min-width: 0; }
  .field:focus-within { border-color: var(--accent); }
  #search { width: 200px; }
  .check { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; user-select: none; }
  .check input { accent-color: var(--accent); }
  .grow { flex: 1; }
  .btn { height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--card);
    cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .btn:hover { border-color: var(--ink); }
  .btn.ink { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.ink:hover { filter: brightness(1.08); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.quiet:hover { color: var(--ink); border-color: var(--line); }
  .btn:disabled { opacity: .55; cursor: default; }
  .icon { width: 34px; padding: 0; justify-content: center; }

  /* ---------- graph paper ---------- */
  #cy { position: relative; min-height: 0; overflow: hidden;
    --g: 24px; --G: 120px; --px: 0px; --py: 0px;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid-major) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: var(--G) var(--G), var(--G) var(--G), var(--g) var(--g), var(--g) var(--g);
    background-position: var(--px) var(--py); }
  .legend { position: absolute; left: 16px; bottom: 16px; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 32px); }
  .legend button { border: 1px solid var(--line); background: var(--card); border-radius: 3px; padding: 5px 9px 4px;
    font-size: 13px; cursor: pointer; color: var(--ink); box-shadow: var(--shadow); border-top: 3px solid var(--c); }
  .legend button[aria-pressed="true"] { outline: 2px solid var(--c); outline-offset: 1px; }
  .legend button.ghost { border: 1px dashed var(--t-missing); border-top: 3px dashed var(--t-missing); color: var(--muted); box-shadow: none; }
  .zoom { position: absolute; right: 16px; bottom: 16px; z-index: 2; display: flex; gap: 6px; }
  .zoom .btn { box-shadow: var(--shadow); }

  /* ---------- side: the index card ---------- */
  aside { background: color-mix(in srgb, var(--paper) 70%, var(--card)); border-left: 1px solid var(--line);
    overflow: auto; padding: 28px 22px 40px; min-height: 0; }
  .card { position: relative; background: var(--card); border-radius: 3px; box-shadow: var(--shadow);
    border: 1px solid var(--line); margin-top: 14px; }
  .card.enter { animation: pull .38s cubic-bezier(.2, .8, .2, 1); }
  @keyframes pull { from { opacity: 0; transform: translateY(18px) rotate(-.8deg); } }
  .tab { position: absolute; top: -22px; left: 14px; height: 23px; padding: 3px 12px 0; border-radius: 4px 4px 0 0;
    background: var(--c, var(--t-note)); color: var(--card); font-size: 13px; font-weight: 600; }
  .tab.ghost { background: transparent; border: 1px dashed var(--t-missing); border-bottom: 0; color: var(--muted); }
  .card-head { padding: 18px 22px 10px; border-bottom: 2px solid var(--margin); }
  .card-head h2 { font: 600 27px/1.15 var(--serif); margin: 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .ruled { padding: 0 22px; line-height: var(--lh);
    background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--lh) - 1px), var(--rule) calc(var(--lh) - 1px) var(--lh));
    background-position: 0 0; background-attachment: local; }
  .prose { font: 17px/var(--lh) var(--serif); padding-top: 0; padding-bottom: var(--lh); min-height: calc(var(--lh) * 5); }
  .prose > * { margin: 0; }
  .prose > * + * { margin-top: var(--lh); }
  .prose h1, .prose h2, .prose h3 { font: 600 17px/var(--lh) var(--serif); }
  .prose ul, .prose ol { padding-left: 22px; }
  .prose code { font-size: 14px; background: color-mix(in srgb, var(--rule) 45%, transparent); padding: 1px 4px; border-radius: 3px; }
  .prose a.wl { text-decoration: none; border-bottom: 1.5px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .prose a.wl:hover { border-bottom-color: var(--accent); }
  .prose a.wl.missing { color: var(--muted); border-bottom-style: dashed; border-bottom-color: var(--t-missing); }
  .prose .tag { font: 500 14px var(--ui); color: var(--muted); }
  .empty-body { color: var(--muted); font-style: italic; }
  textarea.ruled { display: block; width: 100%; border: 0; resize: vertical; min-height: calc(var(--lh) * 12);
    font: 15px/var(--lh) var(--ui); background-color: transparent; outline: none; padding-top: 0; }
  .card-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 22px 16px; border-top: 1px solid var(--line); }
  .kbd { color: var(--muted); font-size: 13px; margin-left: auto; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; background: transparent; cursor: pointer; }
  .chip:hover { color: var(--ink); border-color: var(--ink); }

  .section { margin-top: 26px; }
  .section h3 { font: 600 15px/1.3 var(--ui); margin: 0 0 8px; color: var(--muted); }
  .links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .links button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 4px; width: 100%; box-sizing: border-box; }
  .links button:hover, .links button:focus-visible { background: var(--card); box-shadow: var(--shadow); }
  .links .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--c); flex: none; }
  .links .sw.ghost { background: transparent; border: 1px dashed var(--t-missing); }
  .links .n { margin-left: auto; color: var(--muted); font-size: 13px; }
  .intro { font: 17px/1.55 var(--serif); margin: 0; }
  .intro + .intro { margin-top: 12px; }

  /* ---------- Claude suggestions ---------- */
  .suggest { margin-top: 18px; }
  .slip { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 3px; box-shadow: var(--shadow); }
  .slip-head { display: flex; align-items: baseline; gap: 8px; padding: 12px 16px 4px; }
  .slip-head b { font: 600 16px var(--serif); }
  .slip-head span { color: var(--muted); font-size: 13px; }
  .opt { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 9px 16px; cursor: pointer; align-items: start; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt input { margin: 4px 0 0; accent-color: var(--accent); }
  .opt .t { font-weight: 500; }
  .opt small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.4; margin-top: 1px; }
  .pill { font-size: 12px; font-weight: 500; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; margin-left: 6px; vertical-align: 1px; }
  .slip .card-foot { border-top: 1px solid var(--line); }
  .thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 14px 16px; }
  .pen { width: 26px; height: 2px; background: var(--accent); transform-origin: left; animation: write 1s ease-in-out infinite alternate; }
  @keyframes write { from { transform: scaleX(.15); } to { transform: scaleX(1); } }
  .note { padding: 10px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--card); margin-top: 12px; }
  .note.err { border-color: var(--danger); color: var(--danger); }
  .note.ok { border-color: var(--ok); color: var(--ok); }
  .progress { height: 2px; background: var(--line); margin-top: 10px; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .scan-list .slip { margin-top: 12px; }
  .slip-head button { all: unset; cursor: pointer; font: 600 16px var(--serif); }
  .slip-head button:hover { color: var(--accent); }

  .form { display: flex; flex-direction: column; gap: 14px; padding: 18px 22px; }
  .form label { display: flex; flex-direction: column; gap: 5px; color: var(--muted); font-size: 14px; }
  .form input, .form select { height: 38px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); padding: 0 10px; color: var(--ink); }
  .form input:focus, .form select:focus { border-color: var(--accent); outline: none; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 56vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); padding: 26px 16px 40px; }
    header { padding: 10px 16px; }
    .field.search { flex: 1 1 0; order: 5; }
    .field.tags { order: 6; }
    #search { width: 100%; }
    .hide-sm { display: none; }
    .brand { margin-right: auto; }
    #scanBtn span { display: none; }
    #scanBtn { width: 34px; padding: 0; justify-content: center; }
    .legend { top: 12px; bottom: auto; left: 12px; }
    .legend button { padding: 3px 7px 2px; font-size: 12px; }
    .zoom { right: 12px; bottom: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true">
        <rect x="5" y="1" width="20" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
        <rect x="1" y="6" width="20" height="14" rx="1.5" fill="var(--card)" stroke="currentColor" stroke-width="1.5"/>
        <path d="M1 10.5h20" stroke="var(--margin)" stroke-width="1.5"/>
      </svg>
      <b>Knowledge</b>
    </div>
    <label class="field search">
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m11 11 4 4" stroke="currentColor" stroke-width="1.6"/></svg>
      <input type="search" id="search" placeholder="Find a note" aria-label="Find a note">
    </label>
    <label class="field tags"><select id="tagFilter" aria-label="Filter by tag"><option value="">Any tag</option></select></label>
    <label class="check hide-sm"><input type="checkbox" id="localToggle"> Only nearby notes</label>
    <div class="grow hide-sm"></div>
    <button class="btn" id="scanBtn" title="Ask Claude to suggest links for every note">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1v4M8 11v4M1 8h4M11 8h4M3.5 3.5l2 2M10.5 10.5l2 2M12.5 3.5l-2 2M5.5 10.5l-2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>Suggest links for all</span>
    </button>
    <button class="btn ink" id="newBtn">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      New note
    </button>
    <button class="btn icon quiet" id="themeBtn" aria-label="Switch light or dark">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg>
    </button>
  </header>
  <main id="cy" aria-label="Graph of notes">
    <div class="legend" id="legend" aria-label="Filter by note type"></div>
    <div class="zoom">
      <button class="btn" id="layoutBtn" title="Rearrange the cards">Tidy up</button>
      <button class="btn icon" id="fitBtn" aria-label="Fit all notes on screen" title="Fit all notes on screen">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </main>
  <aside id="panel" aria-live="polite"></aside>
</div>

<script>
const TYPES = ["concept", "person", "book", "project", "note"];
const $ = (s, el = document) => el.querySelector(s);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const api = async (path, opts = {}) => {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
};
const noteUrl = (id) => "/api/notes/" + encodeURIComponent(id);
const typeVar = (t) => "--t-" + (TYPES.includes(t) ? t : "note");

let cy, selected = null, typeFilter = "";

/* ---------- graph ---------- */
function styles() {
  const card = css("--card"), ink = css("--ink"), muted = css("--muted"), line = css("--line");
  return [
    { selector: "node", style: {
      "shape": "round-rectangle", "corner-radius": 3,
      "width": "label", "height": "label", "padding": (n) => 9 + Math.min(n.data("degree"), 6) * 1.5 + "px",
      "label": "data(label)", "text-valign": "center", "text-halign": "center",
      "font-family": "IBM Plex Sans Condensed, Arial Narrow, sans-serif", "font-weight": 500,
      "font-size": (n) => 12 + Math.min(n.data("degree"), 6) * 0.9,
      "text-wrap": "wrap", "text-max-width": 150, "color": ink,
      "background-fill": "linear-gradient", "background-gradient-direction": "to-bottom",
      "background-gradient-stop-colors": (n) => { const c = css(typeVar(n.data("type"))); return `${c} ${c} ${card} ${card}`; },
      "background-gradient-stop-positions": "0 13 13 100",
      "border-width": 1, "border-color": line,
      "underlay-color": "#000", "underlay-opacity": 0, "underlay-padding": 6, "underlay-shape": "round-rectangle",
    }},
    { selector: "node[?ghost]", style: {
      "background-fill": "solid", "background-color": css("--paper"), "background-opacity": 0.85,
      "border-style": "dashed", "border-color": css("--t-missing"), "border-width": 1.2,
      "color": muted, "font-style": "italic", "font-weight": 400,
    }},
    { selector: "edge", style: {
      "width": 1.3, "line-color": css("--edge"), "curve-style": "bezier",
      "target-arrow-shape": "vee", "target-arrow-color": css("--edge"), "arrow-scale": 0.75,
    }},
    { selector: ".faded", style: { "opacity": 0.14 } },
    { selector: ".hidden", style: { "display": "none" } },
    { selector: "edge.hl", style: { "line-color": css("--accent"), "target-arrow-color": css("--accent"), "width": 2 } },
    { selector: "node.hl", style: { "border-color": css("--accent"), "border-width": 1.5 } },
    { selector: "node:selected", style: {
      "border-color": css("--accent"), "border-width": 2,
      "underlay-color": css("--accent"), "underlay-opacity": 0.14,
    }},
  ];
}

function syncPaper() {
  const z = cy.zoom(), p = cy.pan(), el = $("#cy").style;
  el.setProperty("--g", 24 * z + "px");
  el.setProperty("--G", 120 * z + "px");
  el.setProperty("--px", p.x + "px");
  el.setProperty("--py", p.y + "px");
}

function legend() {
  const present = cy ? new Set(cy.nodes().map((n) => n.data("type"))) : new Set(TYPES);
  const types = TYPES.filter((t) => present.has(t));
  $("#legend").innerHTML = types.map((t) =>
    `<button style="--c:var(${typeVar(t)})" data-type="${t}" aria-pressed="${typeFilter === t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")
    + (present.has("missing") ? `<button class="ghost" data-type="missing" aria-pressed="${typeFilter === "missing"}">Not written yet</button>` : "");
  $("#legend").querySelectorAll("button").forEach((b) => b.onclick = () => {
    typeFilter = typeFilter === b.dataset.type ? "" : b.dataset.type;
    legend(); applyFilters();
  });
}

async function loadGraph() {
  const g = await api("/api/graph");
  const old = {};
  const fresh = !cy;
  if (cy) cy.nodes().forEach((n) => (old[n.id()] = { ...n.position() }));
  if (fresh) {
    cy = cytoscape({ container: $("#cy"), elements: [], style: styles(), wheelSensitivity: 0.25, minZoom: 0.25, maxZoom: 2.5 });
    bindEvents();
  }
  cy.elements().remove();
  cy.add([...g.nodes, ...g.edges]);
  const known = cy.nodes().filter((n) => old[n.id()]);
  known.forEach((n) => n.position(old[n.id()]));
  if (known.length !== cy.nodes().length) {
    // place newcomers next to a neighbour so the layout settles gently
    cy.nodes().not(known).forEach((n) => {
      const nb = n.neighborhood("node").filter((x) => old[x.id()]);
      if (nb.length) { const p = old[nb[0].id()]; n.position({ x: p.x + 60, y: p.y + 40 }); }
    });
    runLayout(fresh);
  }
  fillTags(g.nodes);
  legend();
  applyFilters();
  if (selected && cy.getElementById(selected).length) cy.getElementById(selected).select();
}

let layoutDone = Promise.resolve();
function runLayout(fit = false) {
  // first load lays out instantly; later re-layouts glide to the new arrangement
  const first = cy.scratch("laidOut") !== true;
  cy.scratch("laidOut", true);
  const layout = cy.layout({ name: "cose", animate: first || reduced ? false : "end", animationDuration: 650,
    randomize: first, fit: fit || first, numIter: 2500,
    nodeDimensionsIncludeLabels: true, nodeRepulsion: () => 26000, idealEdgeLength: () => 120,
    nodeOverlap: 300, gravity: 0.6, componentSpacing: 120, padding: 60 });
  layoutDone = layout.promiseOn("layoutstop");
  layout.run();
}

function fillTags(nodes) {
  const sel = $("#tagFilter"), cur = sel.value;
  const tags = [...new Set(nodes.flatMap((n) => n.data.tags))].sort();
  sel.innerHTML = `<option value="">Any tag</option>` + tags.map((t) => `<option value="${esc(t)}">#${esc(t)}</option>`).join("");
  if (tags.includes(cur)) sel.value = cur;
}

function applyFilters() {
  const q = $("#search").value.trim().toLowerCase();
  const tag = $("#tagFilter").value;
  const local = $("#localToggle").checked && selected;
  cy.batch(() => {
    cy.elements().removeClass("hidden faded");
    let visible = cy.nodes().filter((n) => (!typeFilter || n.data("type") === typeFilter) && (!tag || n.data("tags").includes(tag)));
    if (local) visible = visible.intersection(cy.getElementById(selected).closedNeighborhood().closedNeighborhood().nodes());
    cy.nodes().not(visible).addClass("hidden");
    if (q) {
      const match = visible.filter((n) => n.data("label").toLowerCase().includes(q));
      cy.elements().not(match).not(match.connectedEdges()).addClass("faded");
    }
  });
}

function bindEvents() {
  cy.on("viewport", syncPaper);
  cy.on("tap", "node", (e) => openNote(e.target.id(), { center: false }));
  cy.on("tap", (e) => { if (e.target === cy) { selected = null; cy.$(":selected").unselect(); showHome(); applyFilters(); } });
  cy.on("mouseover", "node", (e) => e.target.closedNeighborhood().addClass("hl"));
  cy.on("mouseout", "node", () => cy.elements().removeClass("hl"));
}

function focusNode(id) {
  const n = cy.getElementById(id);
  if (!n.length) return;
  cy.$(":selected").unselect(); n.select();
  layoutDone.then(() => cy.animate({ center: { eles: n } }, { duration: reduced ? 0 : 380, easing: "ease-out-cubic" }));
}

/* ---------- panel helpers ---------- */
const panel = () => $("#panel");
function cardShell({ tab, tabClass = "", color, title, sub, body, foot }) {
  return `<article class="card enter">
    <div class="tab ${tabClass}" style="--c:var(${color})">${esc(tab)}</div>
    <div class="card-head"><h2>${esc(title)}</h2>${sub ? `<div class="sub">${sub}</div>` : ""}</div>
    ${body}
    ${foot ? `<div class="card-foot">${foot}</div>` : ""}
  </article>`;
}

function linkList(nodes) {
  return `<ul class="links">${nodes.map((n) => `
    <li><button data-open="${esc(n.id())}">
      <span class="sw ${n.data("ghost") ? "ghost" : ""}" style="--c:var(${typeVar(n.data("type"))})"></span>
      <span>${esc(n.data("label"))}</span>
      <span class="n">${n.data("degree")}</span>
    </button></li>`).join("")}</ul>`;
}
function wireOpen(el) {
  el.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openNote(b.dataset.open));
}

function renderMarkdown(body, title) {
  let md = body.replace(/^\s*#\s+(.+)\n?/, (m, h) => (h.trim().toLowerCase() === title.toLowerCase() ? "" : m));
  // turn [[links]] and #tags into markup, but leave code spans alone
  md = md.split(/(```[\s\S]*?```|`[^`\n]*`)/).map((part, i) => i % 2 ? part : part
    .replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g,
      (m, t, alias) => `[${(alias || t).trim()}](#note:${encodeURIComponent(t.trim().toLowerCase())})`)
    .replace(/(^|\s)#([A-Za-z][\w-]*)/g, '$1<span class="tag">#$2</span>')).join("");
  const html = marked.parse(md.trim());
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  tmp.querySelectorAll('a[href^="#note:"]').forEach((a) => {
    const id = decodeURIComponent(a.getAttribute("href").slice(6));
    a.className = "wl" + (cy.getElementById(id).data("ghost") ? " missing" : "");
    a.dataset.open = id;
  });
  return tmp.innerHTML.trim() || `<p class="empty-body">Nothing written yet.</p>`;
}

/* ---------- views ---------- */
function showHome() {
  const notes = cy.nodes().filter((n) => !n.data("ghost"));
  const ghosts = cy.nodes().filter((n) => n.data("ghost"));
  const top = notes.sort((a, b) => b.data("degree") - a.data("degree")).slice(0, 6);
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  panel().innerHTML = cardShell({
    tab: "Overview", color: "--t-note", title: "Your slip box",
    sub: `${plural(notes.length, "note")} and ${plural(cy.edges().length, "link")}`,
    body: `<div class="ruled prose" style="padding-top:0">
      <p>Each card is a note in your <code>vault</code> folder. Write <code>[[Note title]]</code> to link two notes, and they connect here.</p>
      <p>Click a card to read it. Dashed cards are notes you've linked to but not written yet.</p>
    </div>`,
  }) + (top.length ? `<section class="section"><h3>Most connected</h3>${linkList(top)}</section>` : "")
     + (ghosts.length ? `<section class="section"><h3>Not written yet</h3>${linkList(ghosts)}</section>` : "");
  wireOpen(panel());
}

async function openNote(id, { center = true } = {}) {
  selected = id;
  if (center) focusNode(id); else { cy.$(":selected").unselect(); cy.getElementById(id).select(); }
  applyFilters();
  const node = cy.getElementById(id);
  if (!node.length) return;
  if (node.data("ghost")) return showGhost(node);
  let note;
  try { note = await api(noteUrl(id)); } catch (e) { panel().innerHTML = `<div class="note err">${esc(e.message)}</div>`; return; }
  const type = note.type, neighbours = node.neighborhood("node");
  panel().innerHTML = cardShell({
    tab: type[0].toUpperCase() + type.slice(1), color: typeVar(type), title: note.title,
    sub: `${note.links.length ? `Links to ${note.links.length}` : "No links yet"}${neighbours.length ? `, connected to ${neighbours.length}` : ""}`
       + (note.tags.length ? `<div class="chips">${note.tags.map((t) => `<button class="chip" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>` : ""),
    body: `<div id="noteBody" class="ruled prose">${renderMarkdown(note.body, note.title)}</div>`,
    foot: `<button class="btn" id="editBtn">Edit</button>
      <button class="btn" id="suggestBtn">Suggest links</button>`,
  }) + `<div id="sugg" class="suggest"></div>`
     + (neighbours.length ? `<section class="section"><h3>Connected notes</h3>${linkList(neighbours)}</section>` : "");
  wireOpen(panel());
  panel().querySelectorAll("[data-tag]").forEach((b) => b.onclick = () => { $("#tagFilter").value = b.dataset.tag; applyFilters(); });
  $("#editBtn").onclick = () => editNote(id, note);
  $("#suggestBtn").onclick = () => suggest(id);
}

function editNote(id, note) {
  const card = $(".card", panel());
  card.classList.remove("enter");
  $("#noteBody").outerHTML = `<textarea id="editor" class="ruled" spellcheck="true" aria-label="Note text"></textarea>`;
  $("#editor").value = note.raw;
  $("#editor").focus();
  $(".card-foot", card).innerHTML = `<button class="btn ink" id="saveBtn">Save</button>
    <button class="btn quiet" id="cancelBtn">Cancel</button><span class="kbd">Ctrl+S saves</span>`;
  const save = async () => {
    try {
      await api(noteUrl(id), { method: "PUT", body: JSON.stringify({ raw: $("#editor").value }) });
      await loadGraph();
      await openNote(id, { center: false });
      flash("Saved.", "ok");
    } catch (e) { flash(e.message, "err"); }
  };
  $("#editor").addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
    if (e.key === "Escape") openNote(id, { center: false });
  });
  $("#saveBtn").onclick = save;
  $("#cancelBtn").onclick = () => openNote(id, { center: false });
}

function flash(text, kind) {
  const s = $("#sugg") || panel();
  const el = document.createElement("div");
  el.className = `note ${kind}`; el.textContent = text;
  s.prepend(el);
  setTimeout(() => el.remove(), 3500);
}

async function suggest(id) {
  const btn = $("#suggestBtn");
  btn.disabled = true;
  $("#sugg").innerHTML = `<div class="slip"><div class="thinking"><span class="pen"></span>Claude is reading this note and looking for connections</div></div>`;
  try {
    const s = await api(noteUrl(id) + "/suggest", { method: "POST" });
    renderSuggestions(id, s, $("#sugg"), { title: "Suggested by Claude" });
  } catch (e) { $("#sugg").innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
  btn.disabled = false;
}

function renderSuggestions(id, s, el, { title, onDone, open } = {}) {
  if (!s.links.length && !s.tags.length) {
    el.innerHTML = `<div class="note">Claude found nothing new to link. This note looks well connected.</div>`;
    return;
  }
  const head = open ? `<button data-open="${esc(id)}">${esc(title)}</button>` : `<b>${esc(title)}</b>`;
  el.innerHTML = `<div class="slip">
    <div class="slip-head">${head}<span>Tick what to add</span></div>
    ${s.links.map((l, i) => `<label class="opt"><input type="checkbox" data-link="${i}" checked>
      <span><span class="t">${esc(l.target)}</span>${l.existing ? "" : `<span class="pill">new note</span>`}<small>${esc(l.reason)}</small></span></label>`).join("")}
    ${s.tags.length ? `<label class="opt" style="cursor:default"><span></span><span class="chips" style="margin:0">${s.tags.map((t, i) =>
      `<label class="chip" style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" data-tag="${i}" checked style="margin:0;accent-color:var(--accent)">#${esc(t)}</label>`).join("")}</span></label>` : ""}
    <div class="card-foot"><button class="btn ink" data-accept></button></div>
  </div>`;
  wireOpen(el);
  const accept = $("[data-accept]", el);
  const count = () => {
    const n = el.querySelectorAll("[data-link]:checked, [data-tag]:checked").length;
    accept.textContent = n ? `Add ${n} to note` : "Nothing selected";
    accept.disabled = !n;
  };
  el.querySelectorAll("input").forEach((c) => c.onchange = count);
  count();
  accept.onclick = async () => {
    const links = [...el.querySelectorAll("[data-link]:checked")].map((c) => s.links[c.dataset.link].target);
    const tags = [...el.querySelectorAll("[data-tag]:checked")].map((c) => s.tags[c.dataset.tag]);
    accept.disabled = true;
    try {
      const r = await api(noteUrl(id) + "/accept", { method: "POST", body: JSON.stringify({ links, tags }) });
      await loadGraph();
      const msg = `Added ${r.added_links.length} link${r.added_links.length === 1 ? "" : "s"} and ${r.added_tags.length} tag${r.added_tags.length === 1 ? "" : "s"}.`;
      if (onDone) { el.innerHTML = `<div class="note ok">${esc(title)}: ${msg}</div>`; onDone(); }
      else { await openNote(id, { center: false }); flash(msg, "ok"); }
    } catch (e) { el.insertAdjacentHTML("afterbegin", `<div class="note err">${esc(e.message)}</div>`); accept.disabled = false; }
  };
}

function showGhost(node) {
  const title = node.data("label");
  const from = node.neighborhood("node");
  panel().innerHTML = cardShell({
    tab: "Not written yet", tabClass: "ghost", color: "--t-missing", title,
    sub: `Linked from ${from.length} note${from.length === 1 ? "" : "s"}`,
    body: `<div class="form">
      <label>What kind of note is it?<select id="ghostType">${TYPES.map((t) => `<option value="${t}">${t[0].toUpperCase() + t.slice(1)}</option>`).join("")}</select></label>
    </div>`,
    foot: `<button class="btn ink" id="createBtn">Create note</button>`,
  }) + (from.length ? `<section class="section"><h3>Linked from</h3>${linkList(from)}</section>` : "");
  wireOpen(panel());
  $("#createBtn").onclick = () => createNote(title, $("#ghostType").value);
}

async function createNote(title, type) {
  try {
    const r = await api("/api/notes", { method: "POST", body: JSON.stringify({ title, type }) });
    await loadGraph();
    openNote(r.id);
  } catch (e) { flash(e.message, "err"); }
}

function showNewForm() {
  selected = null; cy.$(":selected").unselect(); applyFilters();
  panel().innerHTML = cardShell({
    tab: "New", color: "--accent", title: "New note",
    body: `<div class="form">
      <label>Title<input type="text" id="newTitle" placeholder="For example: Second brain"></label>
      <label>Kind<select id="newType">${TYPES.map((t) => `<option value="${t}">${t[0].toUpperCase() + t.slice(1)}</option>`).join("")}</select></label>
    </div>`,
    foot: `<button class="btn ink" id="createBtn">Create note</button><button class="btn quiet" id="cancelBtn">Cancel</button>`,
  });
  $("#newTitle").focus();
  const go = () => $("#newTitle").value.trim() && createNote($("#newTitle").value.trim(), $("#newType").value);
  $("#createBtn").onclick = go;
  $("#cancelBtn").onclick = showHome;
  $("#newTitle").onkeydown = (e) => e.key === "Enter" && go();
}

async function scanAll() {
  const nodes = cy.nodes().filter((n) => !n.data("ghost"));
  selected = null; cy.$(":selected").unselect(); applyFilters();
  panel().innerHTML = cardShell({
    tab: "Claude", color: "--accent", title: "Suggesting links for all notes",
    sub: `<span id="scanMeta">Starting</span><div class="progress"><i id="scanBar"></i></div>`,
    body: "",
  }) + `<div class="scan-list" id="scanList"></div>`;
  $("#scanBtn").disabled = true;
  let found = 0;
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    $("#scanMeta").textContent = `Reading ${n.data("label")} (${i + 1} of ${nodes.length})`;
    $("#scanBar").style.width = (i / nodes.length) * 100 + "%";
    try {
      const s = await api(noteUrl(n.id()) + "/suggest", { method: "POST" });
      if (!s.links.length && !s.tags.length) continue;
      found++;
      const box = document.createElement("div");
      $("#scanList").append(box);
      renderSuggestions(n.id(), s, box, { title: n.data("label"), open: true, onDone: () => {} });
    } catch (e) {
      $("#scanList").insertAdjacentHTML("afterbegin", `<div class="note err">${esc(e.message)}</div>`);
      break;
    }
  }
  $("#scanBar").style.width = "100%";
  $("#scanMeta").textContent = found
    ? `${found} of ${nodes.length} notes have suggestions. Review them below.`
    : `Checked ${nodes.length} notes. Nothing new to link.`;
  $("#scanBtn").disabled = false;
}

/* ---------- theme ---------- */
function restyle() { if (cy) cy.style(styles()); }
function setTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  try { t ? localStorage.setItem("kg-theme", t) : localStorage.removeItem("kg-theme"); } catch {}
  restyle();
}
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(dark ? "light" : "dark");
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyle);

/* panel links inside rendered notes */
$("#panel").addEventListener("click", (e) => {
  const a = e.target.closest("a.wl");
  if (a) { e.preventDefault(); openNote(a.dataset.open); }
});

$("#search").oninput = applyFilters;
$("#search").onkeydown = (e) => {
  if (e.key !== "Enter") return;
  const hit = cy.nodes(":visible").filter((n) => !n.hasClass("faded"))[0];
  if (hit && $("#search").value.trim()) openNote(hit.id());
};
$("#tagFilter").onchange = applyFilters;
$("#localToggle").onchange = applyFilters;
$("#layoutBtn").onclick = () => runLayout(true);
$("#fitBtn").onclick = () => cy.animate({ fit: { eles: cy.nodes(":visible"), padding: 60 } }, { duration: reduced ? 0 : 400 });
$("#newBtn").onclick = showNewForm;
$("#scanBtn").onclick = scanAll;
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $("#search").focus(); }
});

(async () => {
  let saved = null;
  try { saved = localStorage.getItem("kg-theme"); } catch {}
  if (saved) document.documentElement.dataset.theme = saved;
  await document.fonts.ready.catch(() => {});
  await loadGraph();
  syncPaper();
  showHome();
})();
</script>
</body>
</html>
